<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        h1 {
            color: #0A66C2;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #444;
            line-height: 1.5;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
            background: #0A66C2;
            color: white;
            padding: 14px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: 0.25s;
        }

        .btn:hover {
            background: #004182;
        }

        .logo {
            width: 26px;
            height: 26px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Bienvenue sur mon profil LinkedIn</h1>

        <p>
            Expertise Systèmes & Réseaux<br>
            Cybersécurité<br>
            Recherche Alternance 2026
        </p>

        <a class="btn" href="https://www.linkedin.com/in/mamadou-mouctar-balde" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" class="logo">
            Voir mon profil LinkedIn
        </a>
    </div>

</body>
</html>
